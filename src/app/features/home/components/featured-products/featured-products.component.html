<section class="py-10">

  <div class="container space-y-8">

    <app-section-heading
      [title]="'Featured'"
      [subTitle]="'Products'"
    />

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
      @for (product of products; track product._id) {
        <app-product-card [product]="product" />
      }
    </div>

  </div>

</section>
