<section class="py-10 bg-gray-50">

  <div class="container">

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
      @for (item of serviceFeatureList; track item.id) {
        <div class="flex items-center gap-4 bg-white p-4 rounded-lg shadow-sm transition hover:shadow-md">
          <div [class]="item.colors" class="size-12 rounded-full flex justify-center items-center">
            <ng-icon class="size-5!" [name]="item.icon" />
          </div>
          <div class="space-y-0.5">
            <h3 class="text-sm text-gray-900 font-semibold"> {{ item.title }} </h3>
            <p class="text-xs text-gray-500"> {{ item.description }} </p>
          </div>
        </div>
      }
    </div>

  </div>

</section>
