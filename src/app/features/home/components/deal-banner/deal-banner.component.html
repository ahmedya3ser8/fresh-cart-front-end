<section class="py-10">

  <div class="container">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

      @for (item of dealBanners; track $index) {
        <div [class]="item.gradient" class="text-white p-8 rounded-2xl space-y-4">

          <div class="px-3 py-1 rounded-full bg-white/20 text-sm w-fit">
            {{ item.badge }}
          </div>

          <h3 class="text-2xl md:text-3xl font-bold"> {{ item.title }} </h3>

          <p class="text-white/80"> {{ item.description }} </p>

          <div class="flex items-center gap-4">
            <span class="text-3xl font-bold"> {{ item.discount }} </span>
            <div class="text-sm text-white/70">
              Use code:
              <span class="font-bold text-white"> {{ item.code }} </span>
            </div>
          </div>

          <a routerLink="/products" [class]="item.textColor" class="w-fit px-6 py-3 bg-white font-semibold rounded-full flex items-center gap-1.5 transition hover:bg-gray-100">
            {{ item.buttonText }}
            <ng-icon name="heroArrowSmallRight" />
          </a>

        </div>
      }

    </div>

  </div>

</section>
