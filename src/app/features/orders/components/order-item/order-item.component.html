<div class="flex gap-5 p-6">
  <div class="size-24 sm:size-28 rounded-2xl bg-linear-to-r from-gray-50 to-white border border-gray-100 p-2.5 relative">
    <img [src]="order.cartItems[0].product.imageCover" class="w-full h-full object-contain" [alt]="order.cartItems[0].product.title" />
    <span class="absolute -top-2 -right-2 size-7 bg-gray-900 text-white text-xs font-bold rounded-full flex items-center justify-center"> +5 </span>
  </div>
  <div class="flex-1 space-y-4">
    <div class="space-y-2">
      @if (order.isPaid) {
        <div class="inline-flex items-center gap-1.5 px-2.5 py-1 bg-blue-100 text-blue-600 rounded-lg">
          <ng-icon size="12" name="heroTruckSolid" />
          <span class="text-xs font-semibold text-blue-600">
            On the way
          </span>
        </div>
      } @else {
        <div class="inline-flex items-center gap-1.5 px-2.5 py-1 bg-amber-100 text-amber-600 rounded-lg">
          <ng-icon size="12" name="heroClockSolid" />
          <span class="text-xs font-semibold text-amber-600">
            Processing
          </span>
        </div>
      }
      <h3 class="font-bold text-gray-900 text-lg flex items-center gap-2">
        <ng-icon size="12" class="text-gray-400!" name="heroHashtag" />
        {{ order.id }}
      </h3>
    </div>
    <div class="flex items-center gap-3 flex-wrap text-sm text-gray-500">
      <div class="flex items-center gap-1.5">
        <ng-icon size="12" name="heroCalendar" />
        <span> {{ order.createdAt | date }} </span>
      </div>
      <span class="size-1 rounded-full bg-gray-300"></span>
      <div class="flex items-center gap-1.5">
        <ng-icon size="12" name="heroArchiveBox" />
        <span> {{ order.cartItems.length || 0 }} items </span>
      </div>
      <span class="size-1 rounded-full bg-gray-300"></span>
      <div class="flex items-center gap-1.5">
        <ng-icon size="12" name="heroMapPin" />
        <span> {{ order.shippingAddress.city }} </span>
      </div>
    </div>
    <div class="flex items-center justify-between flex-wrap gap-4">
      <div class="flex items-center gap-1">
        <span class="text-2xl font-bold text-gray-900"> {{ order.totalOrderPrice || 0 }} </span>
        <span class="text-sm font-medium text-gray-400"> EGP </span>
      </div>
      <button (click)="toggle.emit()" class="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold bg-gray-100 text-gray-700 cursor-pointer transition hover:bg-gray-200">
        Details
        <ng-icon size="12" name="heroChevronDown" />
      </button>
    </div>
  </div>
</div>
