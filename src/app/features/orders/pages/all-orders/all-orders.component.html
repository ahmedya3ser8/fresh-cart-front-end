<section class="py-10">
  <div class="container">

    @if (orders.length) {
      <app-breadcrumb
        [breadcrumbs]="breadcrumbs"
        [color]="'text-gray-500! hover:text-green-600!'"
      />

      <div class="space-y-2 my-5 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="size-14 rounded-xl bg-linear-to-r from-green-600 to-green-700 text-white flex items-center justify-center">
            <ng-icon size="24" name="heroArchiveBoxSolid" />
          </div>
          <div class="space-y-0.5">
            <h1 class="text-3xl font-bold text-gray-900"> My Orders </h1>
            <p class="text-gray-500"> Track and manage your {{ orders.length || 0 }} orders </p>
          </div>
        </div>
        <a routerLink="/home" class="text-green-600 font-medium px-4 py-2 rounded-xl flex items-center gap-2 transition hover:text-green-700 hover:bg-green-50 text-sm">
          <ng-icon name="heroShoppingBagSolid" />
          Continue Shopping
        </a>
      </div>

      <div class="space-y-5">
        @for (order of orders; track order._id) {
          <div class="bg-white rounded-2xl border border-gray-100 shadow-sm">
            <app-order-item [order]="order" (toggle)="toggle(order._id)" />
            @if (openOrderId === order._id) {
              <app-order-details [order]="order" />
            }
          </div>
        }
      </div>
    }
    @else {
      <div class="space-y-5 flex justify-center items-center flex-col">
        <div class="size-24 rounded-full bg-gray-100 flex items-center justify-center">
          <ng-icon size="36" name="heroArchiveBoxSolid" />
        </div>
        <h2 class="text-2xl font-bold text-gray-900"> No orders yet </h2>
        <p class="text-gray-500 text-sm font-medium leading-relaxed text-center">
          When you place orders, they'll appear here <br /> so you can track them.
        </p>
        <button routerLink="/home" class="w-fit bg-green-600 text-white py-4 px-6 rounded-xl font-semibold transition-all hover:bg-green-700 flex items-center justify-center gap-3 shadow-md cursor-pointer">
          <ng-icon name="heroShoppingBagSolid" />
          Start Shopping
        </button>
      </div>
    }

  </div>
</section>
