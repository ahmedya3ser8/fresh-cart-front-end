<div class="bg-white shadow-sm rounded-xl p-6 h-fit space-y-4">

  <swiper-container #mainSwiper init="false">
    @for (image of product.images; track $index) {
      <swiper-slide>
        <img [src]="image" class="w-full" [alt]="product.title" />
      </swiper-slide>
    }
  </swiper-container>

  <swiper-container #thumbsSwiper init="false">
    @for (image of product.images; track $index) {
      <swiper-slide>
        <img
          [src]="image"
          class="w-25 h-30 cursor-pointer"
          [alt]="product.title"
        />
      </swiper-slide>
    }
  </swiper-container>

</div>
