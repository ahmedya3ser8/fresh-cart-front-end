<div class="bg-linear-to-br from-emerald-500 to-emerald-600 text-white shadow-xl p-8 rounded-2xl flex flex-col gap-4 justify-center items-center">
  <span class="block text-6xl font-bold tracking-tight">
    {{ ratingsAverage }}
  </span>
  <div class="flex items-center gap-1 text-yellow-300!">
    @for (item of [1,2,3,4,5]; track $index) {
      <ng-icon class="size-5!" name="heroStarSolid" />
    }
  </div>
  <p class="text-emerald-100 text-sm">
    Based on {{ reviewsCount || 0 }} verified reviews
  </p>
  <button (click)="isOpen = true" class="bg-white text-emerald-700 transition hover:bg-gray-100 px-6 py-3 rounded-xl text-sm font-semibold cursor-pointer flex items-center gap-2">
    <ng-icon class="size-4.5!" name="heroPencilSolid" />
    Write a Review
  </button>
</div>

<!-- Modal -->
@if (isOpen) {
  <div class="fixed inset-0 z-100 bg-black/40 backdrop-blur-sm flex items-center justify-center">
    <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-lg space-y-6">

      <button (click)="close()" class="text-gray-400 transition hover:text-gray-600 cursor-pointer block ml-auto">
        <ng-icon class="size-6!" name="heroXMark" />
      </button>

      <h3 class="text-2xl font-semibold text-gray-900">
        Write a Review
      </h3>

      <div class="space-y-3">
        <h4 class="text-sm font-medium text-gray-700"> Your Rating </h4>
        <div class="flex items-center gap-3">
          <div class="flex">
            @for (star of [1,2,3,4,5]; track star) {
              <ng-icon
                name="heroStarSolid"
                class="text-gray-300! size-7.5! cursor-pointer"
                [class.text-yellow-400!]="star <= selectedRating || star <= hoverRating"
                [class.text-gray-300!]="star > selectedRating || star <= hoverRating"
                (click)="setRating(star)"
                (mouseenter)="onMouseEnter(star)"
                (mouseleave)="onMouseLeave()"
              />
            }
          </div>
          @if (currentLabel) {
            <span class="text-sm font-medium text-gray-600">
              {{ currentLabel }}
            </span>
          }
        </div>
      </div>

      <div class="space-y-3">
        <h4 class="text-sm font-medium text-gray-700"> Your Review </h4>
        <textarea
          [(ngModel)]="review"
          class="w-full h-32 p-4 rounded-xl border border-gray-200 resize-none text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"
          placeholder="Share your experience with this product..."
        ></textarea>
      </div>

      <div class="flex justify-end gap-4">
        <button type="button" (click)="close()" class="px-6 py-2.5 rounded-xl border border-gray-200 text-gray-600 transition hover:bg-gray-50 cursor-pointer">
          Cancel
        </button>
        <button type="submit" (click)="submitForm()" class="px-6 py-2.5 rounded-xl font-medium text-white bg-emerald-600 transition hover:bg-emerald-700 cursor-pointer">
          Submit Review
        </button>
      </div>

    </div>
  </div>
}
